name: Java CI with Maven and Update Frontend Submodule

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write  # Grants write access to the repository

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout backend code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Maven
      run: mvn -B package

    - name: Get current date
      id: date
      run: echo "RELEASE_TAG=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

    - name: Create GitHub Tag
      run: |
        git tag ${{ env.RELEASE_TAG }}
        git push origin ${{ env.RELEASE_TAG }}

    - name: Create GitHub Release
      id: create_release  # Capture the output of this step
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        release_name: "Release ${{ env.RELEASE_TAG }}"
        draft: false
        prerelease: false

    - name: List files in target directory
      run: ls -la target

    - name: Upload JAR file to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}  # Pass the upload URL
        asset_path: target/AutoYara-1.0-SNAPSHOT.jar
        asset_name: AutoYara-1.0-SNAPSHOT-${{ env.RELEASE_TAG }}.jar
        asset_content_type: application/java-archive

    - name: Checkout frontend repository
      uses: actions/checkout@v3
      with:
        repository: Botacin-s-Lab/AutoPYara
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main 
        path: frontend


    - name: Initialize submodule in frontend
      run: git submodule update --init --recursive

    - name: Create folder for JAR file in frontend
      run: |
        mkdir -p frontend/JARs  # Create the folder if it doesn't exist

    - name: Copy JAR file to frontend folder
      run: |
        cp target/AutoYara-1.0-SNAPSHOT-${{ env.RELEASE_TAG }}.jar frontend/JARs/AutoYara-${{ env.RELEASE_TAG }}.jar

    - name: Commit changes to frontend repository
      run: |
        cd frontend
        git add JARs/AutoYara-${{ env.RELEASE_TAG }}.jar
        git commit -m "Update JAR release to ${{ env.RELEASE_TAG }}"
        git push origin main
