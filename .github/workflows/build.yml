name: Java CI with Maven

# Every push to main compiles the project (cheap breakage check).
# A GitHub Release with the built jar is cut ONLY when the head commit's
# SUBJECT line asks for one -- "NewVersion" or "New version"
# (case-insensitive, both spellings accepted) -- or when this workflow is
# dispatched manually with the `release` input checked.
#
# Only the first line of the commit message is inspected. Matching the whole
# message means a commit body that merely *describes* the trigger phrase
# fires a release by accident; that has already happened once in the sibling
# AutoPYaraPyPI repository.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: "Cut a release (tag + GitHub Release with the built jar)"
        type: boolean
        default: false

permissions:
  contents: write # create tags and releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Decide whether a release was requested
        id: check
        env:
          # Passed via env rather than interpolated into the script body, so a
          # crafted commit message cannot inject shell commands here.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' }}
        run: |
          if [[ "$MANUAL_RELEASE" == "true" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch requested a release."
            exit 0
          fi

          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1 | tr '[:upper:]' '[:lower:]')
          if [[ "$SUBJECT" == *"newversion"* || "$SUBJECT" == *"new version"* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Commit subject requests a release -> will publish a jar."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No release trigger in commit subject -> build only."
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      # Hand the exact built jar to the release job, so what gets published is
      # the artifact that was actually built here rather than a rebuild.
      - name: Upload jar as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoyara-jar
          path: target/AutoYara-*.jar
          if-no-files-found: error

  release:
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the jar built by the build job
        uses: actions/download-artifact@v4
        with:
          name: autoyara-jar
          path: dist

      - name: Create the tag, release, and attach the jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(date +'%Y%m%d%H%M%S')"
          JAR="$(ls dist/AutoYara-*.jar | head -1)"
          ASSET="dist/AutoYara-1.0-SNAPSHOT-${TAG}.jar"
          [ "$JAR" = "$ASSET" ] || cp "$JAR" "$ASSET"

          # Built with printf so no YAML indentation leaks into the notes
          # (4+ leading spaces would render as a code block on GitHub).
          NOTES="$(printf '%s\n' \
            "Automated build of \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`." \
            "" \
            "Built with \`mvn -B package\` (Temurin JDK 17)." \
            "" \
            "Consumed by the [autopyara](https://pypi.org/project/autopyara/) Python package as \`autopyara/jars/AutoYara.jar\`.")"

          # gh creates the tag at the checked-out commit as part of this call.
          # The commit SHA goes in the notes so a published jar can always be
          # traced back to the source it was built from -- the pom version is
          # a fixed 1.0-SNAPSHOT and cannot serve that purpose.
          gh release create "$TAG" "$ASSET" \
            --title "Release $TAG" \
            --notes "$NOTES"
